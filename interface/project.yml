# Provost — macOS demo app for the RL environment audit service.
# Regenerate the Xcode project with `make gen` (xcodegen). Never hand-edit the .xcodeproj.
name: Provost
options:
  bundleIdPrefix: dev.camelhack
  xcodeVersion: "27.0"
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Never shipped: ad-hoc "Sign to Run Locally", no sandbox, no hardened runtime.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  Provost:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Blue folder reference: fixture subfolders are copied into the bundle as-is,
      # so Bundle.main can find Resources/fixtures/<env-id>/<file>.json.
      - path: Resources/fixtures
        type: folder
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Provost
        CFBundleDisplayName: Provost
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "CamelHack 2026"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.camelhack.provost
        PRODUCT_NAME: Provost
        ENABLE_PREVIEWS: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ProvostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Provost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.camelhack.provost.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Provost:
    build:
      targets:
        Provost: all
        ProvostTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProvostTests
